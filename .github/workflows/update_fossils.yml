name: 🦕 Auto Update Fossils & Deploy

on:
  schedule:
    # Run automatically every Sunday at midnight (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔄 Fetch latest data from MNHN, PBDB & GBIF
        run: |
          python src/data/ingest_all_france.py
          python src/data/merge_all.py

      - name: 📦 Build Vite App
        run: |
          npm ci || npm install
          npx vite build

      - name: 🚀 Commit & Push updated datasets
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add processed/ public/processed/ dist/ README.md
          git diff-index --quiet HEAD || git commit -m "chore(data): auto-update fossils database from MNHN, PBDB and GBIF"
          git push origin main
